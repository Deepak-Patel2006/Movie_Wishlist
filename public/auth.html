<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie_Wishlist</title>
    <link rel="icon" type="image/x-icon" href="logo_movie.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css?_cacheOverride=1774798464506"
    />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <section class="header">
      <section class="sub_section2">
        <div id="hero">
          <h2>Discover Movies</h2>
          <h2>Save to Your <span class="color_it">Wishlist</span></h2>
          <p>
            Explore poular movies and keep track of the ones you
            <span class="color_it">love ❤</span>
          </p>
          <br>
          <p id="formSubtitle">Sign in to continue your movie journey.</p>
        </div>
      </section>

      <section class="form-panel">
        <div class="form-wrapper">
          <div class="tabs">
            <button class="tab active" id="loginTab" type="button">Sign In</button>
            <button class="tab" id="signupTab" type="button">Sign Up</button>
          </div>

          <form id="authForm">
            <div class="field" id="nameField" hidden>
              <label for="name">Full name</label>
              <input
                type="text"
                id="name"
                placeholder="Your name"
              />
            </div>

            <div class="field">
              <label for="email">Email address</label>
              <input
                type="email"
                id="email"
                placeholder="you@example.com"
              />
            </div>

            <div class="field">
              <label for="password">Password</label>
              <div class="password-wrapper">
                <input
                  type="password"
                  id="password"
                  placeholder="Enter your password"/>
                <button
                  type="button"
                  id="togglePassword"
                  class="toggle-password"
                  >Show
                </button>
              </div>
            </div>

            <p id="formMessage" class="form-message" aria-live="polite"></p>

            <button type="submit" class="submit-btn" id="submitBtn">
              Sign In <span>→</span>
            </button>
          </form>

          <p class="switch-text">
            <span id="switchPrompt">Don't have an account?</span>
            <button type="button" id="switchMode">Sign Up</button>
          </p>

          <a href="index.html" class="back-link"> ← Back to movie Wishlist</a>
        </div>
      </section>
    </section>
  </body>
  <script src="auth.js"></script>
</html>
